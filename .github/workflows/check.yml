name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # A fresh clone must hand out unsolved exercises. It is easy to commit a
      # worked-through file by accident -- `git add -A` in a working copy that is
      # also someone's workspace does it silently.
      - name: Exercises are unsolved
        run: |
          fail=0
          for f in */exercises/exercise_*.py; do
            grep -q '# TODO' "$f" || { echo "solved in the repository: $f"; fail=1; }
          done
          exit $fail

      # Every model solution must pass the same test its exercise does.
      # The `your_turn` tests are excluded -- they are meant to be red in a fresh clone.
      - name: Tests (model solutions)
        run: uv run pytest -m "not your_turn"

      - name: Types
        run: uv run mypy

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Every notebook must run top to bottom -- explore and selfcheck alike.
      # Cells that fail on purpose carry the `raises-exception` tag.
      - name: Notebooks
        run: |
          for f in */*.ipynb; do
            echo "--- $f"
            uv run jupyter nbconvert --to notebook --execute --stdout "$f" > /dev/null
          done
