name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # uv sync above would quietly update uv.lock if pyproject.toml had moved on.
      # This fails instead, so a lock file that was not committed is caught here
      # rather than by whoever clones next.
      - name: Lock file matches pyproject.toml
        run: uv lock --check

      # A fresh clone must hand out unsolved exercises. It is easy to commit a
      # worked-through file by accident -- `git add -A` in a working copy that is
      # also someone's workspace does it silently.
      - name: Exercises are unsolved
        run: |
          fail=0
          for f in */exercises/exercise_*.py; do
            grep -q '# TODO' "$f" || { echo "solved in the repository: $f"; fail=1; }
          done
          exit $fail

      # Module 15's exercise 09 is a test suite the student writes. A fresh clone
      # has an empty folder there, and that is correct -- but an empty folder is
      # also what a lost directory looks like, so check the model suite is present.
      - name: Module 15 has its model suite
        run: test -f 15_testing/solutions/suite/test_parsing.py

      # Module 24 is a window, and ubuntu-latest has neither the tkinter binding nor
      # a screen. Measured on a probe run: `import tkinter` raises until python3-tk
      # is installed, and Tk() then needs a DISPLAY, which xvfb provides without a
      # monitor attached. Module 24's tests skip themselves when there is no display,
      # so this is what makes them actually run here rather than quietly pass.
      - name: A display for module 24
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk xvfb

      # Module 19's database is gitignored -- it is a build artefact made from the
      # two CSV files next to it. This has to come before the tests: a fresh clone
      # has the CSV files and no database, and module 19's tests read the database.
      - name: Build module 19's database
        run: uv run 19_sql/build_db.py

      # Every model solution must pass the same test its exercise does.
      # The `your_turn` tests are excluded -- they are meant to be red in a fresh clone.
      - name: Tests (model solutions)
        run: xvfb-run -a uv run pytest -m "not your_turn"

      - name: Types
        run: uv run mypy

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Module 26 states twenty-four acceptance criteria, and criteria nobody has
      # satisfied might be unsatisfiable. demos/26_reference is the implementation the
      # numbers in the brief were measured from; if this goes red the brief is wrong
      # and not the student.
      - name: Module 26's criteria are satisfiable
        run: uv run 26_project/check.py demos/26_reference

      # Every notebook must run top to bottom -- explore and selfcheck alike.
      # Cells that fail on purpose carry the `raises-exception` tag.
      - name: Notebooks
        run: |
          for f in */*.ipynb; do
            echo "--- $f"
            xvfb-run -a uv run jupyter nbconvert --to notebook --execute --stdout "$f" > /dev/null
          done
