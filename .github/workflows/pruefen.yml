name: pruefen

on: [push, pull_request]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # Jedes Entdecken-Notebook muss von oben nach unten durchlaufen.
      # Leere Vorhersagen sind dabei in Ordnung -- geprueft wird, dass nichts abstuerzt.
      - name: Notebooks ausfuehren
        run: |
          for f in */entdecken.ipynb; do
            echo "--- $f"
            uv run jupyter nbconvert --to notebook --execute --stdout "$f" > /dev/null
          done

      # Die Loesungen muessen laufen und ihre erwartete Ausgabe erzeugen.
      - name: Loesungen ausfuehren
        run: |
          for f in */uebungen/loesungen.py; do
            echo "--- $f"
            uv run "$f" > /dev/null
          done

      # Die Aufgaben-Skelette muessen wenigstens syntaktisch gueltig sein --
      # ausfuehrbar sind sie erst, wenn jemand sie ausfuellt.
      - name: Aufgaben-Skelette pruefen
        run: uv run python -m compileall -q */uebungen/aufgabe_*.py

      - run: uv run ruff check .
      - run: uv run ruff format --check .
