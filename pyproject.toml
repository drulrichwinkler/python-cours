[project]
name = "python-course"
version = "2026.1"
description = "Python course: from zero to an application you can show"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["course"]

[dependency-groups]
# The toolchain. Installed by `uv sync`, because every module from 00 on needs it.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyterlab>=4.0",
    "nbclient>=0.10",
    "mypy>=1.11",
]

# Everything below is NOT installed by `uv sync`. Each group belongs to a part of
# the course, and you install it when you get there:
#
#   uv sync --group net      before module 16
#   uv sync --group data     before module 18
#   uv sync --group apps     before module 20
#
# The point of the split is that the first fifteen modules need nothing but the
# standard library, and pandas plus five web frameworks is a long download to make
# somebody wait for on their first afternoon. See README.md, "Dependency groups".

# Modules 16-17: data over HTTP, and scraping.
net = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

# Module 18: pandas.
data = [
    "pandas>=2.2",
]

# Modules 21-25: the five frameworks that solve the same task five ways.
# tkinter (module 24) is in the standard library and is not listed here -- on Linux
# it may need a system package, which module 24 says how to check.
apps = [
    "flask>=3.0",
    "streamlit>=1.38",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "textual>=0.80",
]

[tool.ruff]
line-length = 100
# Exclude markdown: exercise sheets show 'single' next to "double" quotes on purpose,
# and the formatter would unify them and destroy the example.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP003 rewrites type(42) to int. In teaching material type(<literal>) is the whole
# point: module 01 uses it to show that the type belongs to the value, not the name.
ignore = ["UP003"]

[tool.ruff.lint.per-file-ignores]
# An exercise skeleton calls the function the student has yet to write, and imports
# what that function will need. F821 and F401 are the correct diagnoses and the
# wrong complaints: the file is unfinished by design.
"*/exercises/exercise_*.py" = ["F821", "F401"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["00_setup", "01_basics", "02_operators", "03_control_flow", "04_functions", "05_lists", "06_dicts", "07_strings", "08_files", "09_errors", "10_modules", "11_classes", "12_inheritance", "13_generators", "14_decorators", "15_testing"]
markers = [
    "your_turn: checks YOUR solution -- red until you have finished the exercise",
]
# The test suites in module 15 are the exercise, not part of this run. They import
# `sensorlib`, which only resolves when course.checks.run_suite puts the right
# directory on the import path -- so collecting them here would fail.
norecursedirs = ["*/suite", "*/mutants"]

[tool.mypy]
python_version = "3.12"
# Type checking runs on the helper package and on module 00, where type hints are
# introduced as a tool. Modules 01-03 have no annotations yet -- type hints are
# taught properly in module 04, and the checked set grows from there.
files = ["course", "00_setup"]
strict = true
