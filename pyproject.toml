[project]
name = "python-course"
version = "2026.1"
description = "Python course: from zero to an application you can show"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# course/ is the test harness; sensorreport/ is the analysis that Part 5 presents
# five different ways. Both are installed, so any module can import them without a
# sys.path line -- which is module 10's argument, made by this repository.
packages = ["course", "sensorreport"]

[dependency-groups]
# Everything the course needs, in one group, installed by `uv sync`. The toolchain
# first, then the packages the later modules use -- one setup, and nothing to
# install again when you reach module 16.
dev = [
    # The toolchain, needed from module 00 on
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyterlab>=4.0",
    "nbclient>=0.10",
    "mypy>=1.11",
    # Modules 16-17: HTTP and scraping
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    # Module 18: the analysis
    "pandas>=2.2",
    # Modules 21-25: the five frameworks that solve one task five ways.
    # tkinter (module 24) is in the standard library and is not listed -- on Linux
    # it may need a system package, which module 24 says how to check.
    "flask>=3.0",
    "streamlit>=1.38",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "textual>=0.80",
]

[tool.ruff]
line-length = 100
# Exclude markdown: exercise sheets show 'single' next to "double" quotes on purpose,
# and the formatter would unify them and destroy the example.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP003 rewrites type(42) to int. In teaching material type(<literal>) is the whole
# point: module 01 uses it to show that the type belongs to the value, not the name.
ignore = ["UP003"]

[tool.ruff.lint.per-file-ignores]
# An exercise skeleton calls the function the student has yet to write, imports what
# that function will need, and sometimes prepares a value for the line the student
# has to add. F821, F401 and F841 are the correct diagnoses and the wrong
# complaints: the file is unfinished by design.
"*/exercises/exercise_*.py" = ["F821", "F401", "F841"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["00_setup", "01_basics", "02_operators", "03_control_flow", "04_functions", "05_lists", "06_dicts", "07_strings", "08_files", "09_errors", "10_modules", "11_classes", "12_inheritance", "13_generators", "14_decorators", "15_testing", "16_http", "17_scraping", "18_pandas", "19_sql", "20_processes", "21_flask", "22_streamlit", "23_fastapi", "24_tkinter"]
markers = [
    "your_turn: checks YOUR solution -- red until you have finished the exercise",
]
# The test suites in module 15 are the exercise, not part of this run. They import
# `sensorlib`, which only resolves when course.checks.run_suite puts the right
# directory on the import path -- so collecting them here would fail.
norecursedirs = ["*/suite", "*/mutants"]

[tool.mypy]
python_version = "3.12"
# Type checking runs on the helper package and on module 00, where type hints are
# introduced as a tool. Modules 01-03 have no annotations yet -- type hints are
# taught properly in module 04, and the checked set grows from there.
files = ["course", "sensorreport", "00_setup"]
strict = true
